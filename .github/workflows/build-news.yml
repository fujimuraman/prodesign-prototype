name: Build NEWS pages

# news/ の記事（Markdown）や写真を追加・編集して push すると、
# news.html / post-*.html / index.html のニュース欄を自動で作り直してコミットします。
on:
  push:
    branches: [main]
    paths:
      - "news/**"
      - "images/news/**"
      - "templates/**"
      - "build_news.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build news pages
        run: python build_news.py
      - name: Commit generated pages
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.html post-*.html index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "NEWS: 記事を反映（自動ビルド）"
            git push
          fi
