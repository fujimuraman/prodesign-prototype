<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>更新ページ | ProDesign</title>
<style>
  :root { --acc:#8a6a3c; --line:#e3e1dc; --soft:#f5f4f1; --text:#1a1a1a; --mute:#777; --ok:#2e7d32; --ng:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif; color:var(--text); background:#fff; font-size:16px; line-height:1.7; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; font-weight:600; letter-spacing:.04em; }
  header h1 small { font-weight:400; color:var(--mute); margin-left:10px; font-size:13px; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 20px 80px; }
  .tabs { display:flex; gap:8px; margin:8px 0 24px; flex-wrap:wrap; }
  .tab { padding:12px 22px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:16px; border-radius:4px; }
  .tab.on { background:var(--text); color:#fff; border-color:var(--text); }
  .panel { display:none; } .panel.on { display:block; }
  .card { border:1px solid var(--line); border-radius:6px; padding:22px; margin-bottom:20px; background:#fff; }
  .card h2 { font-size:18px; margin:0 0 16px; }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:15px; }
  label small { font-weight:400; color:var(--mute); margin-left:8px; }
  input[type=text], input[type=date], select, textarea { width:100%; font-size:17px; padding:12px 14px; border:1px solid #cfcdc7; border-radius:4px; font-family:inherit; background:#fff; }
  textarea { min-height:260px; line-height:1.8; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--acc); border-color:var(--acc); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .row { grid-template-columns:1fr; } }
  .btn { display:inline-block; padding:14px 28px; font-size:17px; border-radius:4px; border:1px solid var(--text); background:var(--text); color:#fff; cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--acc); border-color:var(--acc); }
  .btn.ghost { background:#fff; color:var(--text); }
  .btn.danger { background:#fff; color:var(--ng); border-color:var(--ng); }
  .btn:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:22px; align-items:center; }
  .msg { padding:14px 16px; border-radius:4px; margin:16px 0; display:none; white-space:pre-wrap; }
  .msg.ok { display:block; background:#e8f5e9; color:var(--ok); }
  .msg.ng { display:block; background:#ffebee; color:var(--ng); }
  .msg.info { display:block; background:var(--soft); color:var(--text); }
  .list { border-top:1px solid var(--line); }
  .item { display:grid; grid-template-columns:110px 96px 1fr auto; gap:14px; align-items:center; padding:14px 6px; border-bottom:1px solid var(--line); }
  @media (max-width:640px){ .item { grid-template-columns:1fr; gap:6px; } }
  .item .d { color:var(--mute); font-size:14px; } .item .c { font-size:12px; background:var(--soft); padding:3px 8px; border-radius:3px; text-align:center; }
  .item .t { font-size:16px; }
  .item .b { display:flex; gap:8px; }
  .item .b button { padding:8px 14px; font-size:14px; }
  .preview { border:1px dashed #cfcdc7; padding:16px; background:var(--soft); min-height:80px; }
  .preview img { max-width:100%; height:auto; display:block; margin:10px 0; }
  .thumb { max-width:260px; display:block; margin-top:10px; border:1px solid var(--line); }
  .hint { font-size:14px; color:var(--mute); }
  .hist { display:grid; grid-template-columns:100px 100px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  @media (max-width:640px){ .hist { grid-template-columns:1fr; } }
  .hist input { font-size:15px; padding:8px 10px; }
  #busy { position:fixed; inset:0; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; font-size:18px; z-index:9; }
  #busy.on { display:flex; }
</style>
</head>
<body>
<header>
  <h1>ProDesign 更新ページ <small>ニュース・事業実績をここから更新できます</small></h1>
  <button class="btn ghost" id="btnSettings" style="padding:8px 14px;font-size:14px;">設定</button>
</header>

<div class="wrap">
  <div class="msg info" id="setupMsg">はじめに右上の「設定」から、薫さんからもらった「アクセスキー」を登録してください。</div>

  <div class="tabs">
    <button class="tab on" data-tab="news">ニュース一覧</button>
    <button class="tab" data-tab="edit">新しい記事を書く</button>
    <button class="tab" data-tab="history">沿革・事業実績</button>
  </div>

  <!-- ===== ニュース一覧 ===== -->
  <section class="panel on" id="panel-news">
    <div class="card">
      <h2>ニュース一覧 <span class="hint" id="newsCount"></span></h2>
      <div class="msg" id="newsMsg"></div>
      <div class="list" id="newsList"><p class="hint" style="padding:16px 0;">読み込み中…</p></div>
    </div>
  </section>

  <!-- ===== 記事の作成・編集 ===== -->
  <section class="panel" id="panel-edit">
    <div class="card">
      <h2 id="editTitle">新しい記事を書く</h2>
      <div class="msg" id="editMsg"></div>
      <input type="hidden" id="editSlug">
      <label>タイトル <small>例：令和8年 9月 大仙市メーカー様に箔研磨装置を納入しました</small></label>
      <input type="text" id="fTitle" placeholder="記事の見出し">
      <div class="row">
        <div>
          <label>日付</label>
          <input type="date" id="fDate">
        </div>
        <div>
          <label>分類</label>
          <select id="fCat">
            <option>お知らせ</option><option>実績</option><option>専門家支援</option><option>セミナー</option><option>メディア</option>
          </select>
        </div>
      </div>
      <label>写真 <small>1枚（任意）。一覧と記事の先頭に表示されます</small></label>
      <input type="file" id="fImage" accept="image/*">
      <img id="fImageThumb" class="thumb" style="display:none" alt="">
      <input type="hidden" id="fImageName">
      <label>本文 <small>空行で段落が分かれます。「●」や「・」で始まる行は箇条書きになります</small></label>
      <textarea id="fBody" placeholder="本文を入力してください"></textarea>
      <label>プレビュー</label>
      <div class="preview" id="fPreview"></div>
      <div class="actions">
        <button class="btn primary" id="btnSave">この内容で公開する</button>
        <button class="btn ghost" id="btnNew">入力をクリア</button>
        <button class="btn danger" id="btnDelete" style="display:none">この記事を削除</button>
        <span class="hint">公開ボタンを押してから、サイトに反映されるまで2〜3分かかります。</span>
      </div>
    </div>
  </section>

  <!-- ===== 沿革・事業実績 ===== -->
  <section class="panel" id="panel-history">
    <div class="card">
      <h2>沿革・事業実績 <span class="hint">企業情報ページの時系列に表示されます</span></h2>
      <div class="msg" id="histMsg"></div>
      <div class="hist" style="font-weight:600;border-bottom:2px solid var(--line);"><span>年（西暦）</span><span>和暦</span><span>内容</span><span></span></div>
      <div id="histRows"></div>
      <div class="actions">
        <button class="btn ghost" id="btnHistAdd">＋ 行を追加</button>
        <button class="btn primary" id="btnHistSave">この内容で公開する</button>
        <span class="hint">例：年「2026.09」 和暦「令和8年」 内容「箔研磨装置納入（大仙市メーカー様）」</span>
      </div>
    </div>
  </section>
</div>

<!-- ===== 設定 ===== -->
<div id="settings" class="card" style="display:none;position:fixed;top:70px;right:20px;width:min(460px,92vw);z-index:6;box-shadow:0 10px 40px rgba(0,0,0,.15);">
  <h2>設定</h2>
  <label>アクセスキー <small>薫さんから受け取った「ghp_…」または「github_pat_…」で始まる文字列</small></label>
  <input type="text" id="sToken" placeholder="貼り付けてください" autocomplete="off">
  <p class="hint">このパソコンのブラウザにだけ保存されます。他の人には見せないでください。</p>
  <div class="actions">
    <button class="btn primary" id="btnTokenSave">保存</button>
    <button class="btn ghost" id="btnTokenClose">閉じる</button>
  </div>
</div>
<div id="busy">送信中です。そのままお待ちください…</div>

<script>
// ===== 設定 =====
const OWNER = "fujimuraman", REPO = "prodesign-prototype", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const CATS = ["お知らせ","実績","専門家支援","セミナー","メディア"];
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("pd_token") || "";
const setMsg = (id, kind, text) => { const el = $(id); el.className = "msg " + (kind || ""); el.textContent = text || ""; };
const busy = (on) => $("busy").classList.toggle("on", !!on);
const enc = (s) => { const b = new TextEncoder().encode(s); let bin = ""; b.forEach(c => bin += String.fromCharCode(c)); return btoa(bin); };
const dec = (b64) => { const bin = atob(b64.replace(/\n/g, "")); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder().decode(a); };

async function gh(path, opts = {}) {
  if (!token()) throw new Error("アクセスキーが未設定です。右上の「設定」から登録してください。");
  const r = await fetch(API + path + (opts.method ? "" : `?ref=${BRANCH}&t=${Date.now()}`), {
    method: opts.method || "GET",
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 404 && !opts.method) return null;
  if (!r.ok) {
    const t = await r.text();
    if (r.status === 401) throw new Error("アクセスキーが正しくありません（または期限切れ）。設定を確認してください。");
    throw new Error(`通信エラー ${r.status}: ${t.slice(0, 200)}`);
  }
  return r.json();
}
const getFile = async (path) => { const j = await gh(path); return j ? { sha: j.sha, text: dec(j.content) } : null; };
const putFile = async (path, text, message, sha, isBinaryB64) => gh(path, { method: "PUT", body: { message, content: isBinaryB64 ? text : enc(text), branch: BRANCH, ...(sha ? { sha } : {}) } });
const delFile = async (path, sha, message) => gh(path, { method: "DELETE", body: { message, sha, branch: BRANCH } });

// ===== front matter =====
function parseMd(text) {
  const m = text.match(/^﻿?---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  const meta = {}; let body = text;
  if (m) { m[1].split("\n").forEach(l => { const i = l.indexOf(":"); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }); body = m[2]; }
  return { meta, body: body.replace(/\n+$/, "") };
}
const toMd = (meta, body) => `---\ntitle: ${meta.title}\ndate: ${meta.date}\ncategory: ${meta.category}\n${meta.image ? "image: " + meta.image + "\n" : ""}---\n\n${body.trim()}\n`;
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function mdPreview(md) {
  return md.trim().split(/\n\s*\n/).map(p => {
    const lines = p.trim().split("\n");
    if (lines.every(l => /^\s*[-*・●]/.test(l))) return "<ul>" + lines.map(l => "<li>" + esc(l.replace(/^\s*[-*・●]\s*/, "")) + "</li>").join("") + "</ul>";
    if (/^!\[.*?\]\((.*?)\)/.test(lines[0])) return lines[0].replace(/^!\[.*?\]\((.*?)\)/, '<img src="$1">');
    return "<p>" + lines.map(esc).join("<br>") + "</p>";
  }).join("");
}
const slugify = (date, title) => {
  const d = date.replace(/\./g, "-");
  const s = title.replace(/[^\w぀-ヿ一-鿿]+/g, "").slice(0, 12);
  return `${d}-${Date.now().toString(36)}`;
};

// ===== タブ =====
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function showTab(name) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "panel-" + name));
  if (name === "news") loadNews();
  if (name === "history") loadHistory();
  if (name === "edit" && !$("editSlug").value) resetForm();
}

// ===== 設定 =====
$("btnSettings").onclick = () => { $("sToken").value = token(); $("settings").style.display = "block"; };
$("btnTokenClose").onclick = () => $("settings").style.display = "none";
$("btnTokenSave").onclick = () => {
  const v = $("sToken").value.trim();
  if (!v) return alert("アクセスキーを入力してください");
  localStorage.setItem("pd_token", v); $("settings").style.display = "none"; $("setupMsg").style.display = "none"; loadNews();
};
if (token()) $("setupMsg").style.display = "none";

// ===== ニュース一覧 =====
let posts = [];
async function loadNews() {
  try {
    setMsg("newsMsg");
    const list = await gh("news");
    const mds = (list || []).filter(f => f.name.endsWith(".md") && !/^readme/i.test(f.name));
    posts = await Promise.all(mds.map(async f => { const j = await getFile("news/" + f.name); const { meta, body } = parseMd(j.text); return { name: f.name, slug: f.name.replace(/\.md$/, ""), sha: j.sha, meta, body }; }));
    posts.sort((a, b) => (b.meta.date || "").localeCompare(a.meta.date || "") || b.slug.localeCompare(a.slug));
    $("newsCount").textContent = `全 ${posts.length} 件`;
    $("newsList").innerHTML = posts.map((p, i) => `<div class="item"><span class="d">${esc(p.meta.date || "")}</span><span class="c">${esc(p.meta.category || "")}</span><span class="t">${esc(p.meta.title || p.slug)}</span><span class="b"><button class="btn ghost" data-edit="${i}">編集</button><a class="btn ghost" style="text-decoration:none" target="_blank" href="post-${p.slug}.html">表示</a></span></div>`).join("") || "<p class='hint' style='padding:16px 0'>記事はまだありません</p>";
    document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editPost(posts[+b.dataset.edit]));
  } catch (e) { setMsg("newsMsg", "ng", e.message); $("newsList").innerHTML = ""; }
}

// ===== 記事フォーム =====
let imageB64 = null;
function resetForm() {
  $("editTitle").textContent = "新しい記事を書く"; $("editSlug").value = ""; $("fTitle").value = ""; $("fCat").value = "お知らせ";
  $("fDate").value = new Date().toISOString().slice(0, 10); $("fBody").value = ""; $("fImage").value = ""; $("fImageName").value = ""; imageB64 = null;
  $("fImageThumb").style.display = "none"; $("btnDelete").style.display = "none"; setMsg("editMsg"); renderPreview();
}
function editPost(p) {
  resetForm();
  $("editTitle").textContent = "記事を編集"; $("editSlug").value = p.slug; $("fTitle").value = p.meta.title || "";
  $("fDate").value = (p.meta.date || "").replace(/\./g, "-"); $("fCat").value = CATS.includes(p.meta.category) ? p.meta.category : "お知らせ";
  $("fBody").value = p.body; $("fImageName").value = p.meta.image || "";
  if (p.meta.image) { $("fImageThumb").src = (p.meta.image.startsWith("images/") ? "" : "images/news/") + p.meta.image; $("fImageThumb").style.display = "block"; }
  $("btnDelete").style.display = "inline-block"; showTab("edit"); renderPreview();
}
function renderPreview() {
  const t = $("fTitle").value, d = $("fDate").value.replace(/-/g, "."), c = $("fCat").value;
  $("fPreview").innerHTML = `<div class="hint">${esc(d)}　${esc(c)}</div><h3 style="margin:6px 0 12px">${esc(t) || "（タイトル）"}</h3>` + ($("fImageThumb").style.display !== "none" ? `<img src="${$("fImageThumb").src}">` : "") + mdPreview($("fBody").value);
}
["fTitle", "fDate", "fCat", "fBody"].forEach(id => $(id).addEventListener("input", renderPreview));
$("fImage").addEventListener("change", () => {
  const f = $("fImage").files[0]; if (!f) return;
  if (f.size > 4 * 1024 * 1024) { alert("写真が大きすぎます（4MBまで）。スマホの写真は「小」サイズで送るか、縮小してください。"); $("fImage").value = ""; return; }
  const r = new FileReader();
  r.onload = () => { imageB64 = r.result.split(",")[1]; const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace("jpeg", "jpg"); $("fImageName").value = `${$("fDate").value || "img"}-${Date.now().toString(36)}.${ext}`; $("fImageThumb").src = r.result; $("fImageThumb").style.display = "block"; renderPreview(); };
  r.readAsDataURL(f);
});
$("btnNew").onclick = resetForm;
$("btnSave").onclick = async () => {
  const title = $("fTitle").value.trim(), date = $("fDate").value.replace(/-/g, "."), cat = $("fCat").value, body = $("fBody").value;
  if (!title) return alert("タイトルを入力してください"); if (!date) return alert("日付を入力してください"); if (!body.trim()) return alert("本文を入力してください");
  busy(true); setMsg("editMsg");
  try {
    let slug = $("editSlug").value || slugify(date, title);
    let imgName = $("fImageName").value;
    if (imageB64) { await putFile("images/news/" + imgName, imageB64, `NEWS: 写真を追加 ${imgName}`, null, true); imageB64 = null; }
    const path = "news/" + slug + ".md";
    const cur = $("editSlug").value ? await getFile(path) : null;
    await putFile(path, toMd({ title, date, category: cat, image: imgName }, body), ($("editSlug").value ? "NEWS: 記事を更新 " : "NEWS: 記事を追加 ") + title, cur && cur.sha);
    $("editSlug").value = slug; $("btnDelete").style.display = "inline-block"; $("editTitle").textContent = "記事を編集";
    setMsg("editMsg", "ok", "送信しました。サイトへの反映まで2〜3分かかります（自動で作り直しています）。\n反映後: " + location.origin + location.pathname.replace(/admin\.html$/, "") + "post-" + slug + ".html");
  } catch (e) { setMsg("editMsg", "ng", e.message); } finally { busy(false); }
};
$("btnDelete").onclick = async () => {
  const slug = $("editSlug").value; if (!slug) return;
  if (!confirm("この記事を削除します。よろしいですか？")) return;
  busy(true);
  try {
    const path = "news/" + slug + ".md"; const cur = await getFile(path);
    if (cur) {
      const img = (parseMd(cur.text).meta.image || "").trim();
      if (img && !img.startsWith("http")) { const ip = img.startsWith("images/") ? img : "images/news/" + img; const ij = await getFile(ip); if (ij) await delFile(ip, ij.sha, "NEWS: 写真を削除 " + img); }
      await delFile(path, cur.sha, "NEWS: 記事を削除 " + slug);
    }
    const gen = await getFile("post-" + slug + ".html"); if (gen) await delFile("post-" + slug + ".html", gen.sha, "NEWS: 生成ページを削除 " + slug);
    resetForm(); setMsg("editMsg", "ok", "削除しました。サイトへの反映まで2〜3分かかります。"); showTab("news");
  } catch (e) { setMsg("editMsg", "ng", e.message); } finally { busy(false); }
};

// ===== 沿革・事業実績 =====
let histSha = null;
async function loadHistory() {
  try {
    setMsg("histMsg");
    const j = await getFile("data/history.json"); histSha = j ? j.sha : null;
    const rows = j ? JSON.parse(j.text) : [];
    renderHist(rows);
  } catch (e) { setMsg("histMsg", "ng", e.message); }
}
function renderHist(rows) {
  $("histRows").innerHTML = rows.map((r, i) => `<div class="hist"><input type="text" value="${esc(r.year || "")}" data-k="year" placeholder="2026.09"><input type="text" value="${esc(r.wareki || "")}" data-k="wareki" placeholder="令和8年"><input type="text" value="${esc(r.text || "")}" data-k="text" placeholder="内容"><button class="btn danger" style="padding:8px 12px;font-size:13px" data-del="${i}">削除</button></div>`).join("");
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const rs = readHist(); rs.splice(+b.dataset.del, 1); renderHist(rs); });
}
const readHist = () => [...document.querySelectorAll("#histRows .hist")].map(d => ({ year: d.querySelector("[data-k=year]").value.trim(), wareki: d.querySelector("[data-k=wareki]").value.trim(), text: d.querySelector("[data-k=text]").value.trim() }));
$("btnHistAdd").onclick = () => { const rs = readHist(); rs.push({ year: String(new Date().getFullYear()), wareki: "", text: "" }); renderHist(rs); window.scrollTo(0, document.body.scrollHeight); };
$("btnHistSave").onclick = async () => {
  const rows = readHist().filter(r => r.year || r.text);
  busy(true); setMsg("histMsg");
  try {
    const cur = await getFile("data/history.json");
    await putFile("data/history.json", JSON.stringify(rows, null, 1) + "\n", "沿革・事業実績を更新", cur && cur.sha);
    setMsg("histMsg", "ok", "送信しました。企業情報ページへの反映まで2〜3分かかります。"); histSha = null;
  } catch (e) { setMsg("histMsg", "ng", e.message); } finally { busy(false); }
};

// 初期化
resetForm();
if (token()) loadNews(); else $("newsList").innerHTML = "";
</script>
</body>
</html>
